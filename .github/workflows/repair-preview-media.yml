name: Repair preview media

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-preview-media.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild WebP files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/new-2026-09
          for id in 6187 6191 6199 6200; do
            cat ".repair-media/${id}/"*.txt | tr -d '\n\r ' | base64 --decode > "assets/new-2026-09/img_${id}.webp"
          done
          python3 - <<'PY'
          from pathlib import Path
          for p in sorted(Path('assets/new-2026-09').glob('img_*.webp')):
              b = p.read_bytes()
              assert b[:4] == b'RIFF' and b[8:12] == b'WEBP', f'bad WebP header: {p}'
              declared = int.from_bytes(b[4:8], 'little') + 8
              assert declared == len(b), f'truncated WebP: {p} ({len(b)} != {declared})'
              print(p, len(b))
          PY

      - name: Commit repaired media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/new-2026-09/*.webp
          git commit -m "fix: restore valid preview WebP media"
          git push
