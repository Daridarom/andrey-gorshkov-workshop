name: Upgrade preview gallery and video
on:
  push:
    paths:
      - '.github/workflows/upgrade-preview-gallery.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build 19-photo album and modern media UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('visual-refresh-2026-09/index.html')
          h=p.read_text(encoding='utf-8')
          if 'preview-enhancements.css' not in h:
              h=h.replace('</head>','<link rel="stylesheet" href="../assets/preview-enhancements.css?v=20260911b"/></head>',1)
          items=[
          (6182,'Лабиринт в орнаментальной композиции',805,798),(6183,'Бирюзовый лабиринт',1280,1269),(6184,'Лабиринт в золотисто-синей гамме',804,798),(6185,'Лабиринт в цветочной композиции',795,798),(6186,'Лабиринт с орнаментом',1190,1175),(6187,'Бирюзовый лабиринт с мандалой',1280,1268),(6188,'Лабиринт на тёмном фоне',1280,1280),(6189,'Красно-зелёный лабиринт',640,640),(6190,'Солнечная композиция',1200,1265),(6191,'Абстрактная композиция',1217,1280),(6192,'Цветочная мандала',1247,1255),(6193,'Геометрическая мандала',1276,1280),(6194,'Круглая мандала в раме',1280,1273),(6195,'Орнаментальная мандала',1117,1134),(6196,'Геометрическая композиция',1261,1272),(6197,'Композиция с подковой',1280,1280),(6198,'Солнечная деревянная композиция',1218,1280),(6199,'Геометрическая авторская композиция',1233,1280),(6200,'Сюжетная авторская композиция',980,1280)]
          cards=[]
          for n,(fid,title,w,hh) in enumerate(items,1):
              src=f'../assets/new-2026-09/img_{fid}.webp'
              cards.append(f'<figure class="work"><a class="work-image" href="{src}" rel="noreferrer" data-title="{title}" aria-label="Рассмотреть крупно: {title}"><img src="{src}" alt="{title} — работа Андрея Сергеевича Горшкова" width="{w}" height="{hh}" loading="lazy" decoding="async"/><span class="work-open" aria-hidden="true">＋</span></a><figcaption><strong>{title}</strong><span>Новая подборка · {n:02d}/19</span></figcaption></figure>')
          album='<details class="collection" id="gallery-new-2026" data-gallery="true" data-gallery-title="Новая подборка · сентябрь 2026" open=""><summary><span>Новая подборка · сентябрь 2026</span><small>19 работ</small><b aria-hidden="true">＋</b></summary><p class="new-works-note">Все 19 новых фотографий из последней подборки. Нажмите на любую работу: она откроется крупно поверх страницы, без перехода в новую вкладку.</p><div class="portfolio-grid new-works-grid">'+''.join(cards)+'</div></details>'
          h,n=re.subn(r'<details class="collection" id="gallery-new-2026".*?</details>',album,h,count=1,flags=re.S)
          assert n==1, 'September collection not found'
          h=re.sub(r'<script src="\.\./assets/workshop-interactions\.js[^>]*></script>','<script src="../assets/preview-interactions.js?v=20260911b" defer=""></script>',h,count=1)
          assert 'preview-interactions.js' in h
          assert h.count('assets/new-2026-09/img_')==38
          assert '<small>19 работ</small>' in h
          assert 'workshop-interactions.js' not in h
          p.write_text(h,encoding='utf-8')
          PY
      - name: Validate preview references
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/preview-enhancements.css
          test -f assets/preview-interactions.js
          test -f assets/films/workshop-loop.mp4
          test -f assets/films/workshop-color.webp
          for id in $(seq 6182 6200); do test -s "assets/new-2026-09/img_${id}.webp"; done
          grep -q '19 работ' visual-refresh-2026-09/index.html
          grep -q 'preview-interactions.js' visual-refresh-2026-09/index.html
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/upgrade-preview-gallery.yml
          git add visual-refresh-2026-09/index.html
          git commit -m 'feat: add 19-photo album, lightbox and reliable video poster'
          git push
