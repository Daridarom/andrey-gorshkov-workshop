name: Import September album
on:
  push:
    paths:
      - '.github/workflows/import-september-album.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download 19 HQ WebP photos
        shell: bash
        run: |
          set -euo pipefail
          base='https://096d14063e62d7.lhr.life'
          mkdir -p assets/new-2026-09
          for id in $(seq 6182 6200); do
            echo "Downloading IMG_${id}"
            curl -fL --retry 5 --retry-delay 2 "$base/img_${id}.webp" -o "assets/new-2026-09/img_${id}.webp"
          done
      - name: Validate all images
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          files=[Path(f'assets/new-2026-09/img_{i}.webp') for i in range(6182,6201)]
          assert len(files)==19
          total=0
          for p in files:
              b=p.read_bytes()
              assert len(b)>120_000, (p,len(b))
              assert b[:4]==b'RIFF' and b[8:12]==b'WEBP', p
              assert struct.unpack('<I',b[4:8])[0]+8==len(b), (p,'truncated')
              total+=len(b)
              print(p.name,len(b),'OK')
          print('TOTAL',total)
          PY
      - name: Commit album and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/import-september-album.yml
          git add assets/new-2026-09/img_*.webp
          git commit -m 'feat: add all 19 September artworks in HQ WebP'
          git push
