name: Finalize preview layout
on:
  push:
    paths:
      - '.github/workflows/finalize-preview-layout.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild preview from original design
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          s = s.replace('<head>', '<head><meta name="robots" content="noindex,nofollow"/>', 1)
          s = s.replace('./assets/', '../assets/')
          s = s.replace('./favicon.png', '../favicon.png')
          s = s.replace('<title>Мастерская Андрея Сергеевича Горшкова</title>', '<title>Мастерская Андрея Сергеевича Горшкова — рабочая версия</title>', 1)
          collection = '''<details class="collection" id="gallery-new-2026" data-gallery="true" data-gallery-title="Новая подборка мастерской" open=""><summary><span>Новая подборка · сентябрь 2026</span><small>4 работы</small><b aria-hidden="true">＋</b></summary><div class="portfolio-grid curated-grid"><figure class="work"><a class="work-image" href="../assets/new-2026-09/img_6187.webp" target="_blank" rel="noreferrer" data-title="Новая работа мастерской" aria-label="Открыть фото целиком"><img src="../assets/new-2026-09/img_6187.webp" alt="Новая работа мастерской Андрея Горшкова" loading="lazy" decoding="async"/><span class="work-open" aria-hidden="true">↗</span></a><figcaption><strong>Новая работа мастерской</strong><span>Из новой подборки · сентябрь 2026</span></figcaption></figure><figure class="work"><a class="work-image" href="../assets/new-2026-09/img_6191.webp" target="_blank" rel="noreferrer" data-title="Новая работа мастерской" aria-label="Открыть фото целиком"><img src="../assets/new-2026-09/img_6191.webp" alt="Новая работа мастерской Андрея Горшкова" loading="lazy" decoding="async"/><span class="work-open" aria-hidden="true">↗</span></a><figcaption><strong>Новая работа мастерской</strong><span>Из новой подборки · сентябрь 2026</span></figcaption></figure><figure class="work"><a class="work-image" href="../assets/new-2026-09/img_6197.webp" target="_blank" rel="noreferrer" data-title="Новая работа мастерской" aria-label="Открыть фото целиком"><img src="../assets/new-2026-09/img_6197.webp" alt="Новая работа мастерской Андрея Горшкова" loading="lazy" decoding="async"/><span class="work-open" aria-hidden="true">↗</span></a><figcaption><strong>Новая работа мастерской</strong><span>Из новой подборки · сентябрь 2026</span></figcaption></figure><figure class="work"><a class="work-image" href="../assets/new-2026-09/img_6200.webp" target="_blank" rel="noreferrer" data-title="Новая работа мастерской" aria-label="Открыть фото целиком"><img src="../assets/new-2026-09/img_6200.webp" alt="Новая работа мастерской Андрея Горшкова" loading="lazy" decoding="async"/><span class="work-open" aria-hidden="true">↗</span></a><figcaption><strong>Новая работа мастерской</strong><span>Из новой подборки · сентябрь 2026</span></figcaption></figure></div></details>'''
          marker = '</details></div><div class="portfolio-note">'
          if marker not in s:
              raise SystemExit('portfolio marker not found')
          s = s.replace(marker, '</details>' + collection + '</div><div class="portfolio-note">', 1)
          Path('visual-refresh-2026-09').mkdir(exist_ok=True)
          Path('visual-refresh-2026-09/index.html').write_text(s, encoding='utf-8')
          PY
      - name: Clean temporary repair files
        run: |
          rm -rf .repair-media
          rm -f .github/workflows/repair-preview-media.yml
          rm -f .github/workflows/finalize-preview-layout.yml
      - name: Commit clean preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restore original design and HQ photography preview'
          git push
