name: Finalize HQ preview media
on:
  push:
    paths:
      - '.github/workflows/finalize-hq-preview.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download high-quality WebP files
        run: |
          set -euo pipefail
          base='https://maria-taxes-walls-dance.trycloudflare.com'
          mkdir -p assets/new-2026-09
          curl -fL --retry 4 "$base/img_6187.webp" -o assets/new-2026-09/img_6187.webp
          curl -fL --retry 4 "$base/img_6191.webp" -o assets/new-2026-09/img_6191.webp
          curl -fL --retry 4 "$base/img_6197.webp" -o assets/new-2026-09/img_6197.webp
          curl -fL --retry 4 "$base/img_6200.webp" -o assets/new-2026-09/img_6200.webp
      - name: Validate media
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          expected={'img_6187.webp':400000,'img_6191.webp':300000,'img_6197.webp':400000,'img_6200.webp':300000}
          for name,minsize in expected.items():
              p=Path('assets/new-2026-09')/name
              b=p.read_bytes()
              assert len(b) >= minsize, (name,len(b))
              assert b[:4] == b'RIFF' and b[8:12] == b'WEBP', name
              assert struct.unpack('<I',b[4:8])[0] + 8 == len(b), (name,'truncated')
              print(name,len(b),'OK')
          PY
      - name: Commit HQ media and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/finalize-hq-preview.yml
          git add assets/new-2026-09/img_6187.webp assets/new-2026-09/img_6191.webp assets/new-2026-09/img_6197.webp assets/new-2026-09/img_6200.webp
          git commit -m 'fix: restore high-quality preview photography'
          git push
